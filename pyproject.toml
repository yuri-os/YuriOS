[project]
name = "yurios"
version = "0.2.0"
description = "YuriOS — an always-on, local-first agentic companion runtime: a VRM body and room with an autonomy engine behind it (book ch. 19/35, SPEC.md)"
# UPPER bound on purpose. litellm caps the Python it supports (1.92.x is
# ">=3.10,<3.14"), and this project declares the floor for everything else. With no
# ceiling here, `python3.14 -m venv` + pip is legal at the project level and then
# backtracks through years of litellm releases hunting for one that accepts 3.14 —
# which surfaces as a bafflingly slow resolve, or a very old litellm, or a hard
# conflict (the failure mode hit on Windows). Cap it so the error arrives at
# `pip install` time, in one line, naming the real constraint. 3.14 also has thin
# wheel coverage across the optional ML extras below. Raise this when litellm does.
requires-python = ">=3.11,<3.14"
dependencies = [
    # YuriOS is one self-contained project: the brain (yurios/app), the voice stack
    # (yurios/desktop), the image service (yurios/forge), the body + mind — all
    # first-party and maintained here. These are their deps too. Copy, install, run.
    #
    # The base install includes the in-process embedding fallback, so memory keeps
    # working when no LM Studio or Ollama server is running. It pulls torch but no
    # model weights; sentence-transformers remains a lazy import at runtime.
    "fastapi",
    "uvicorn[standard]",      # [standard] pulls the websockets impl for /ws/voice
    "litellm",                # the model-router seam (B1 §3.1) — local or hosted
    "pydantic-settings",      # typed config (§11)
    "python-dotenv",          # …and the per-character keys it can't declare (§10.5)
    "pyyaml",                 # soul.yaml + .md frontmatter
    "numpy",                  # the flat vector index + audio frames
    "httpx",                  # ollama embeddings, GPT-SoVITS client, search + fetch (§7.7)
    "httpcore>=1,<2",         # public network backend used to pin validated fetch DNS
    # The hands (§7): real MCP server + client, in-repo. CAPPED, like litellm above,
    # and for a harder reason: mcp 2.0.0 renamed the module her server is built on.
    # `mcp.server.fastmcp` → `mcp.server.mcpserver`, `FastMCP` → `MCPServer`, and
    # `mcp.shared.memory.create_connected_server_and_client_session` — the in-memory
    # session the contract test connects through (§13) — is gone, with no alias left
    # behind for any of it. Uncapped, a fresh install resolved 2.0.0, `import mcp`
    # kept working (so the doctor's tools row still said ok), and the only symptom was
    # the spawned server dying on its import line: "No module named
    # 'mcp.server.fastmcp'", then "she has no hands this run". Raise this when
    # world/tools/{server,client}.py speak 2.x.
    "mcp>=1.2,<2",            # >=1.2 is where FastMCP landed in the official SDK
    "Pillow",                 # her camera (§7.6): the vendored forge's mock backend + provenance
    "python-multipart",       # bounded character-card uploads in the local dashboard
    # Her tray icon (§18.4.7): StatusNotifierItem + dbusmenu, spoken directly.
    # Linux-only by marker because both interfaces are freedesktop ones — macOS
    # and Windows have their own tray and no session bus to put this on. A wheel,
    # unlike PyGObject, which builds against girepository and would be invisible
    # to a uv venv anyway (it does not see system site-packages).
    "dbus-fast; sys_platform == 'linux'",
    "sentence-transformers",  # local embedding default and LM Studio fallback
]

[project.optional-dependencies]
# Real voice backends are optional imports (B2 §3): the loop runs against fakes with
# none installed, so `pytest` is green on a machine with no models or GPU — the full
# 185-test suite passes on a bare `pip install -e ".[test]"`.
#
# Each extra is ONE optional backend beyond the always-available local embedder.
# Measured venv size on disk (Linux, py3.12, CPU torch where torch is involved — with
# PyPI's CUDA torch instead, add ~3.8 GB to every torch row; see CPU TORCH below):
#
#   [test]         base + pytest, including local sentence-transformers
#   [stt]          564 MB   faster-whisper — CTranslate2, no torch at all
#   [tts]          1.3 GB   kokoro → torch (747 MB of it is torch itself)
#   [vad]            —      silero-vad → torch, shared with [tts]
#   [test,voice]   stt + tts + vad — what ./install.sh installs by default
#   [all]          voice stack (the local embedder is already in the base install)
#   [tts-sovits]    +2 MB   just soundfile — the model lives in a server you run
#   [voice,tts-qwen] 2.1 GB transformers, accelerate, librosa, gradio, pandas
#   [desktop]      798 MB   pywebview + Qt (QtWebEngine)
#   [gpu]          6.4 GB   everything, on PyPI's CUDA torch — the old default
#
stt = ["faster-whisper"]                     # ears (B2 §3.2) — CTranslate2, torch-free
tts = ["kokoro", "soundfile"]                # the DEFAULT voice: CPU, GPU-free, fast
vad = ["silero-vad"]                         # turn-taking (B2 §3.4)
# TTS_BACKEND=qwen3_tts — the designed persona voice, and the only extra that really
# wants a CUDA GPU (QWEN_DEVICE=cuda:0). Deliberately NOT in [voice] or [all]: it
# drags transformers + accelerate + gradio + pandas for a backend nothing defaults to.
#
# The numba floor is load-bearing, and the failure without it is a nasty one.
# qwen-tts → librosa → numba, and numba caps numpy (0.62+ is "numpy<2.4"). Our core
# numpy is unpinned, so it resolves to 2.5.x — and rather than cap numpy, the resolver
# walks numba BACKWARDS looking for a release with no numpy ceiling. It gets all the
# way to numba 0.53.1 / llvmlite 0.36.0, which support only Python >=3.6,<3.10, have
# no wheel for any Python we support, and so attempt a source build that dies with:
#   "RuntimeError: Cannot install on Python version 3.12.7; only >=3.6,<3.10"
# `uv pip compile` reports that resolution as fine — it never builds — so this is only
# visible on a real install. The floor makes capping numpy the resolver's only move.
tts-qwen = ["qwen-tts", "soundfile", "numba>=0.61"]
# TTS_BACKEND=gpt_sovits — an HTTP client for a GPT-SoVITS server you run yourself,
# so there is no model here at all: just the audio decode. Nothing CUDA in-process.
tts-sovits = ["soundfile"]
tts-kokoro = ["kokoro", "soundfile"]         # alias of [tts], kept for older docs
# `--window`: float her on the desktop (§6.5, world/window.py). Installs the Qt
# engine (QtWebEngine = Chromium), which the vendored launcher prefers: WebKitGTK
# caps rAF at ~30fps and needs NVIDIA quirks — a full 3D body suffers more than
# B2's Live2D did. WINDOW_GUI=gtk + pywebview[gtk] is the lighter fallback.
desktop = ["pywebview", "qtpy", "PyQt6", "PyQt6-WebEngine"]
test = ["pytest", "pytest-asyncio", "httpx", "numpy"]
# The gate `./scripts/check.sh` runs before a commit: lint + typecheck on top of
# [test]. `build` is here for scripts/smoke_install.sh, which needs a wheel.
#
# Floors, and a ceiling at the next major so the CONFIG in this file keeps being
# understood — not so the findings stay fixed. Ruff before 1.0 adds rules in minor
# releases and mypy sharpens its inference in every one, so upgrading either can turn
# up findings on a commit that touched nothing. That is the tools working. Read them,
# fix them or ignore them by name here — do not pin your way out of hearing about it.
dev = ["yurios[test]", "ruff>=0.14,<1", "mypy>=1.18,<3", "build>=1.2,<2"]
# Her own camera: a local SDXL checkpoint (SELFIE_BACKEND=diffusers) rendered
# in-process — no A1111/ComfyUI server, no API key. Needs torch WITH CUDA for
# real speed (the default PyPI wheel is the CUDA one — the opposite of the CPU
# advice below); the checkpoint itself (~7 GB .safetensors) is user-supplied
# from Civitai, never shipped. See .env.example's SELFIE_LOCAL_* block.
forge-local = ["diffusers", "transformers", "accelerate", "safetensors"]
# The other local camera: a Krea 2 checkpoint — a ~12.5 B diffusion transformer,
# so it is shipped (and RUN) as INT4 "ConvRot" and never dequantized; at bf16 it
# would be ~23 GB and fit nothing. comfy-kitchen provides that layout's
# tensor-core GEMM, which is what makes ~6 GB resident and fast possible on a
# 16 GB card. Two things this needs beyond the extra: the checkpoint itself
# (user-supplied, ~7 GB, never shipped) and a one-time Hugging Face fetch of the
# text encoder + VAE from the GATED krea/Krea-2-Raw repo — accept its licence,
# then `huggingface-cli login`. See .env.example's SELFIE_LOCAL_* block.
forge-krea2 = ["diffusers", "transformers", "accelerate", "safetensors",
               "comfy-kitchen", "huggingface-hub"]
# Direct GGUF fallback for a local `lm_studio/...` chat route. llama-cpp-python's
# wheel is CPU-first; users who build it with CUDA/Metal can expose layers through
# GGUF_N_GPU_LAYERS without changing YuriOS.
llm = ["llama-cpp-python", "huggingface-hub"]
# The default local voice stack, GPU-free: ears + the kokoro voice + turn-taking.
# This is what "install the real voice" means; `pip install -e ".[voice,test]"`.
voice = ["faster-whisper", "kokoro", "soundfile", "silero-vad"]
# Every optional local backend the defaults can select. Still NO qwen and NO Qt —
# `all` used to mean "6.2 GB including a CUDA build you don't run".
all = ["faster-whisper", "kokoro", "soundfile", "silero-vad", "llama-cpp-python", "huggingface-hub"]
# Genuinely everything, GPU voice and desktop window included. Opt in by name.
gpu = ["faster-whisper", "kokoro", "soundfile", "silero-vad",
       "qwen-tts", "numba>=0.61",          # the floor matters here too — see [tts-qwen]
        "pywebview", "qtpy", "PyQt6", "PyQt6-WebEngine", "llama-cpp-python", "huggingface-hub"]

[project.scripts]
yurios = "yurios.cli:main"

# --- CPU TORCH -------------------------------------------------------------------
# sentence-transformers is a base dependency, and kokoro/silero-vad also depend on
# torch. On Linux the default PyPI torch wheel bundles CUDA. Measured in a venv with
# nothing else in it:
#
#   torch (default PyPI wheel)   4.5 GB on disk   2.73 GB download, 23 CUDA packages
#   torch (whl/cpu index)        747 MB on disk   ~195 MB download
#
# torch itself is only 527 MB of that 2.73 GB; the rest is nvidia-cublas (423 MB),
# nvidia-cudnn (366 MB), cufft (214 MB), nccl (206 MB), triton (198 MB), cusparselt
# (170 MB) and friends. None of it runs: the default voice (kokoro) is CPU-only and
# the GPU belongs to your LLM anyway. This was the bulk of the old 6.2 GB install.
#
# Install the CPU build FIRST and the extras below reuse it (747 MB, not 4.5 GB):
#
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[voice,test]"
#
# torchAUDIO has to be on that line too, not just torch: kokoro and silero-vad load its
# C++ extension, and PyPI's torchaudio is built against CUDA torch, so on a CPU-only
# torch it fails with "libcudart.so.13: cannot open shared object file" — both seams
# quietly degrade to fakes while pip and find_spec both call the install fine. The
# doctor compares the two build tags because nothing else can see it.
#
# Not pinned here as an index override: that would force CPU torch on people running
# TTS_BACKEND=qwen3_tts or EMBED_BACKEND=sentence_tf on a real GPU. It stays a choice.
# (Windows/macOS PyPI wheels are CPU-only already, so this only matters on Linux.)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --- LINT ------------------------------------------------------------------------
# `ruff check`, and deliberately NOT `ruff format`. The formatting here is hand-set —
# comment columns aligned to the code they annotate, line breaks chosen to keep a
# clause together — and a formatter would rewrite 36k lines to say nothing new.
# The lint is for the things a reader can't see: a name that isn't defined, an import
# that stopped being used, a variable assigned into the void.
[tool.ruff]
target-version = "py311"        # the floor in requires-python
line-length = 100               # what the code already does; E501 is off regardless

[tool.ruff.lint]
# Ruff's default set (E4 imports, E7 statements, E9 syntax/IO, F pyflakes) minus the
# three rules that only disagree with house style. Nothing here is a taste rule: each
# one below catches code that is wrong, not code that is written differently.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E741",  # `l` for a line, in ~15 comprehensions, consistently and only there
    "E702",  # `b.declare("a", "a"); b.declare("b", "b")` — paired setup, one thought
    "E731",  # `one = lambda s: …` in memory/store.py, three lines above its only use
]

[tool.ruff.lint.per-file-ignores]
# dbus-fast reads the D-Bus type signature OUT of the annotation: `-> "s"` is a
# string on the wire, `-> "(sss)"` a struct, `-> "b"` a boolean. It is the bus's type
# language, not Python's, so pyflakes is right that no such name exists and wrong
# that it matters. Every F821/F722 in these two files is one of those signatures.
"yurios/world/tray.py" = ["F821", "F722"]
"tests/test_tray.py" = ["F821", "F722"]
# conftest stubs `dotenv.load_dotenv` BEFORE importing anything that would call it —
# see the comment there; the late imports are the whole mechanism, not an accident.
"tests/conftest.py" = ["E402"]

# --- TYPECHECK -------------------------------------------------------------------
# Set where the codebase actually is, not where a greenfield project would start.
# Most of these 36k lines are annotated, but not all, and `--strict` on the lot
# reports thousands of findings — a number nobody reads, which is the same as no
# typecheck at all. So: check the bodies that carry annotations, believe the ones
# that don't, and let the floor rise per-module (see the overrides at the bottom).
[tool.mypy]
files = ["yurios"]
# No `python_version` on purpose. Pinning it to the 3.11 floor makes mypy PARSE the
# installed stubs at that level too, and numpy's `__init__.pyi` uses 3.12's `type X =`
# statement — one syntax error in site-packages, and "errors prevented further
# checking" on the whole run. Unset, mypy targets the interpreter it is running under,
# which is the one whose stubs are on disk. Version-floor breakage is caught where it
# is real: scripts/smoke_install.sh, on a 3.11 install.
# The dependency tree is mostly untyped or stub-less (litellm, kokoro, dbus_fast,
# mcp, sentence_transformers…). Without this, every import line is a finding and the
# real ones drown.
ignore_missing_imports = true
# An unannotated `def` is not an error — it is just unchecked. That is the deal that
# keeps this runnable today; tighten it a module at a time below.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
# Optional handling is where the real bugs are (a None reaching an attribute access),
# so that one stays strict even at this altitude.
strict_optional = true
# Not a package-level namespace conflict: yurios/desktop/main.py and
# yurios/world/main.py are two different modules with the same basename.
explicit_package_bases = true
# tests/ is not checked. The suite is 1,296 tests of deliberately loose fakes —
# duck-typed stand-ins for a TTS, a model, a bus — and typing those is work that
# would make the fakes harder to write without making the runtime any safer.

# dbus-fast reads the D-Bus type signature out of the annotation: `-> "s"`, `-> "u"`,
# `-> "(sss)"`. mypy reads them as forward references to names that do not exist and
# reports all 51 of them. Same false positive as ruff's F821 above, same answer.
[[tool.mypy.overrides]]
module = "yurios.world.tray"
ignore_errors = true

# --- THE BASELINE ----------------------------------------------------------------
# These 36 modules were written before there was a typecheck, and between them they
# report 133 findings — mostly duck-typed seams (a settings dict splatted into a
# typed library constructor, an `object`-typed model that is whatever the router
# returned) and Optionals that a runtime guard rules out where mypy cannot see it.
# A handful are real: an `Optional` dereferenced without a check, a `str | None`
# handed to something that wants `str`.
#
# They are listed rather than fixed because clearing them is a typing pass over the
# runtime, not release infrastructure, and mixing the two makes both unreviewable.
# What this buys today: the other 132 modules ARE checked, so nothing NEW arrives
# unnoticed, and the debt has a name and a length instead of being a number nobody
# has looked at.
#
# The list may only shrink. To work one off: delete its line, run `mypy`, fix what
# it says, keep it deleted.
[[tool.mypy.overrides]]
module = [
    "yurios.app.providers.gguf",
    "yurios.app.providers.usage",
    "yurios.characters.appearance",
    "yurios.characters.card",
    "yurios.characters.exporter",
    "yurios.characters.models",
    "yurios.cli",
    "yurios.desktop.brain",
    "yurios.desktop.main",
    "yurios.desktop.routes.voice_ws",
    "yurios.desktop.voice.latency",
    "yurios.desktop.voice.ws_limits",
    "yurios.forge.backends.diffusers",
    "yurios.forge.backends.krea2",
    "yurios.forge.backends.mock",
    "yurios.forge.backends.openrouter",
    "yurios.forge.provenance",
    "yurios.forge.service",
    "yurios.mind.dreamjobs",
    "yurios.mind.knowledge",
    "yurios.mind.loop",
    "yurios.mind.workspace",
    "yurios.world.avatar.controller",
    "yurios.world.brain",
    "yurios.world.channels.notify",
    "yurios.world.channels.telegram",
    "yurios.world.host",
    "yurios.world.main",
    "yurios.world.routes.mind",
    "yurios.world.routes.voice_ws",
    "yurios.world.selfies",
    "yurios.world.tools.client",
    "yurios.world.tools.fetch",
    "yurios.world.voicestack",
    "yurios.world.vram",
    "yurios.world.window",
]
ignore_errors = true

[tool.setuptools]
# one namespace package `yurios`, with the former top-level modules as subpackages:
# the brain (yurios.app), the voice stack (yurios.desktop), the image service
# (yurios.forge, §7.6), Build #4's body (yurios.world), and the mind (yurios.mind).
packages = { find = { include = ["yurios*"] } }

[tool.setuptools.package-data]
# the pinned voice clip the qwen3_tts backend clones (B2 §3.3) ships with the package
"yurios.desktop" = ["voice/assets/*.wav"]
# her look + the selfie template library (§7.6) travel with the forge
"yurios.forge" = ["characters/*.yaml", "templates/*.yaml"]
# the portrait a migrated/first-run Yuri starts with, until the forge renders her one
"yurios.characters" = ["assets/*.png"]
