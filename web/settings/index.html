<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1110">
  <meta name="description" content="YuriOS house settings — the .env every character inherits">
  <title>YuriOS / House settings</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7M10 2.5v4M5 9.5v4' fill='none' stroke='%23d7ff58' stroke-width='1.6' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="/shared/neon.css">
  <!-- the row styling every room's gear dialog uses: the controls on this page
       are the same controls (SPEC §11.2), drawn by the same script -->
  <link rel="stylesheet" href="/shared/settings.css">
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <svg class="icon-bank" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 19-7-7 7-7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0M12 14l4-4"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><path d="M8 8h8v8H8zM9 4v4M15 4v4M9 16v4M15 16v4M4 9h4M4 15h4M16 9h4M16 15h4"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M5 5h14v14H5zM9 9h6M9 12h6M9 15h3"/></symbol>
    <symbol id="i-mind" viewBox="0 0 24 24"><path d="M12 4a4 4 0 0 0-4 4 3 3 0 0 0-1 5.8V16a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3v-2.2A3 3 0 0 0 16 8a4 4 0 0 0-4-4M12 8v11"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.5 4a4.5 4.5 0 0 0-5.9 5.6L4 14.2 6.8 17l4.6-4.6A4.5 4.5 0 0 0 17 6.5z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.4 3.5 5 3.5 8s-1 5.6-3.5 8c-2.5-2.4-3.5-5-3.5-8s1-5.6 3.5-8"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h4l1.5-2h5L16 8h4v11H4zM12 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></symbol>
    <symbol id="i-room" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4zM10 20v-5h4v5"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4z"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 4M20 5v6h-6"/></symbol>
  </svg>

  <div class="page-noise" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Back to the switchboard">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-copy"><b>YuriOS</b><small>house settings</small></span>
    </a>
    <div class="topbar-state">
      <span class="file-chip" title="the file every save writes to">
        <i class="file-dot" aria-hidden="true"></i><span id="env-path">.env</span>
      </span>
    </div>
    <div class="topbar-actions">
      <!-- SPEC §11.3: two presses — the first asks, the second ends the server so
           the supervisor starts it again on the saved .env -->
      <button id="restart" class="button button-quiet" type="button" disabled>
        <svg><use href="#i-restart"></use></svg><span>Restart</span>
      </button>
      <a class="button button-quiet" href="/"><svg><use href="#i-back"></use></svg><span>Switchboard</span></a>
    </div>
  </header>

  <main class="shell">
    <nav class="rail" id="rail" aria-label="Settings sections">
      <label class="rail-search">
        <svg aria-hidden="true"><use href="#i-search"></use></svg>
        <span class="sr-only">Search every setting</span>
        <input id="search" type="search" placeholder="Search settings" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <a class="rail-item" href="#/overview" data-page="overview"><svg><use href="#i-gauge"></use></svg><span>Overview</span></a>
      <!-- the rest are drawn from the server's layout (envfile.PAGES), then the
           files .env only names, then one page per character -->
      <span class="rail-group">House</span>
      <div id="rail-pages" class="rail-pages"></div>
      <span class="rail-group">Add-ons</span>
      <div id="rail-addons" class="rail-pages"></div>
      <span class="rail-group" hidden>Characters</span>
      <div id="rail-characters" class="rail-pages"></div>
    </nav>

    <section class="stage">
      <div class="stage-head">
        <h1 class="neon-sign"><span id="page-title" class="neon-tube">Overview</span><span class="neon-rail" aria-hidden="true"></span></h1>
        <p id="page-note" class="stage-note"></p>
      </div>
      <div id="stage-body" class="stage-body" aria-live="polite">
        <p class="placeholder">loading…</p>
      </div>
      <!-- the add-on pages and the character pages: drawn when visited -->
      <div id="stage-extra" class="stage-body" hidden></div>
    </section>
  </main>

  <!-- Only there while something is unsaved, or just was: the one place that
       says what a save did, and that it waits for a restart. -->
  <footer id="savebar" class="savebar" hidden>
    <span id="save-note" class="save-note" role="status"></span>
    <button id="savebar-restart" class="button button-quiet" type="button" hidden>Restart now</button>
    <button id="discard" class="button button-quiet" type="button">Discard</button>
    <button id="save" class="settings-save" type="button">Save</button>
  </footer>

  <div id="restarting" class="restarting" hidden role="status">
    <div class="restarting-card">
      <span class="restarting-spin" aria-hidden="true"></span>
      <strong>Restarting YuriOS</strong>
      <p>Her voice and rooms drop for a moment; this page reloads when she is back.</p>
    </div>
  </div>

  <!-- the controls themselves (raw, from the /shared mount, exactly as every
       room loads them), then this page's layout over them -->
  <script src="/shared/settings.js"></script>
  <script type="module" src="./settings.js"></script>
</body>
</html>
